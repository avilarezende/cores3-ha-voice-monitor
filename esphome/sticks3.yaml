# M5Stack StickS3 (ESP32-S3-PICO-1-N8R8) — monitor de sons -> Sound Monitor (UDP 5050)
# Pinos verificados: docs.m5stack.com/en/core/StickS3 + M5GFX/M5Unified (board_M5StickS3)
substitutions:
  name: sticks3-monitor
  friendly_name: StickS3 Monitor
  sound_monitor_host: 192.168.31.18
  sound_monitor_port: "5050"
  pm1_addr: "0x6E"
  # dBFS: 0 = fundo de escala. Abaixo disto, por mic_silence_ms, o ES8311 é reinicializado.
  mic_silence_dbfs: "-90.0"
  mic_silence_ms: "180000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  on_boot:
    # M5PM1: igual ao M5GFX — G2 (L3B) = saída push-pull alta => alimenta LCD; reg 0x09=0 (sem sleep I2C)
    - priority: 850
      then:
        - lambda: |-
            auto pm = id(pm1);
            auto rmw = [&](uint8_t reg, uint8_t mask, bool on) {
              uint8_t v = 0; pm->read_byte(reg, &v);
              v = on ? (v | mask) : (v & ~mask); pm->write_byte(reg, v);
            };
            pm->write_byte(0x09, 0x00);
            rmw(0x16, 1 << 2, false);  // G2 função GPIO
            rmw(0x10, 1 << 2, true);   // G2 saída
            rmw(0x13, 1 << 2, false);  // push-pull
            rmw(0x11, 1 << 2, true);   // nível alto (LCD on)
            // G3 = pulso do amplificador do alto-falante: manter desligado (só usamos o microfone)
            rmw(0x16, 1 << 3, false); rmw(0x10, 1 << 3, true); rmw(0x13, 1 << 3, false); rmw(0x11, 1 << 3, false);
            ESP_LOGI("sticks3", "M5PM1 configurado (LCD on, PA off)");
    - priority: 600
      then:
        - light.turn_on: { id: backlight, brightness: 70% }
        - component.update: lcd

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "StickS3 Monitor Fallback"
    password: !secret fallback_ap_password
  on_connect: { then: [ component.update: lcd ] }
  on_disconnect: { then: [ component.update: lcd ] }

captive_portal:

external_components:
  - source: { type: local, path: components }
    components: [audio_udp_stream]

i2c:
  - id: i2c_int
    sda: GPIO47
    scl: GPIO48
    frequency: 100kHz

i2c_device:
  - id: pm1
    i2c_id: i2c_int
    address: ${pm1_addr}
  - id: es_raw
    i2c_id: i2c_int
    address: 0x18

# ES8311 (0x18) — I2S: MCLK G18, BCLK G17, LRCK G15, dados do mic -> ESP G16 (M5Unified)
audio_dac:
  - platform: es8311
    id: codec
    i2c_id: i2c_int
    address: 0x18
    use_microphone: true
    use_mclk: true
    sample_rate: 16000
    bits_per_sample: 16bit
    mic_gain: 30DB

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

audio_udp_stream:
  id: sound_stream
  microphone: mic
  host: ${sound_monitor_host}
  port: ${sound_monitor_port}

# LCD ST7789P3 135x240 (SPI3: MOSI G39, SCK G40, DC G45, CS G41, RST G21), BL PWM G38
spi:
  - id: spi_lcd
    clk_pin: GPIO40
    mosi_pin: GPIO39
    interface: spi3

output:
  - platform: ledc
    id: bl_out
    pin: GPIO38
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Tela"
    output: bl_out
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto"
    id: f_small
    size: 14
    glyphsets: [GF_Latin_Core]

image:
  - file: calico_logo_64.png
    id: calico_logo
    type: RGB565
    transparency: alpha_channel

display:
  - platform: mipi_spi
    id: lcd
    spi_id: spi_lcd
    model: ST7789V
    dc_pin: GPIO45
    cs_pin: GPIO41
    reset_pin: GPIO21
    dimensions:
      width: 135
      height: 240
      offset_width: 52
      offset_height: 40
    invert_colors: true
    rotation: 90
    data_rate: 40MHz
    update_interval: 10s
    lambda: |-
      it.fill(Color::BLACK);
      it.image(4, 4, id(calico_logo));
      auto ip = id(wifi_ip).state;
      it.printf(74, 6,  id(f_small), Color::WHITE, "StickS3 Monitor");
      it.printf(74, 26, id(f_small), ip.empty() ? Color(255,80,80) : Color(120,255,120), "WiFi: %s", ip.empty() ? "conectando" : ip.c_str());
      it.printf(74, 46, id(f_small), Color::WHITE, "HA: %s", api::global_api_server->is_connected() ? "conectado" : "aguardando");
      float db = id(mic_rms).state;
      if (id(sound_stream).is_streaming() && (db == db)) {
        it.printf(4, 74, id(f_small), db < ${mic_silence_dbfs}f ? Color(255, 80, 80) : Color::WHITE, "Audio: %d dBFS", (int) db);
      } else {
        it.printf(4, 74, id(f_small), Color::WHITE, "Audio: %s", id(sound_stream).is_streaming() ? "transmitindo" : "desligado");
      }
      auto a = id(ultimo_alerta).state;
      it.printf(4, 96, id(f_small), Color(255,200,0), "Alerta: %s", (a.empty() || a == "unknown") ? "-" : a.c_str());
      it.printf(4, 116, id(f_small), Color(150,150,150), "A: liga/desliga audio");

switch:
  - platform: template
    id: sound_monitor_switch
    name: "Monitor de sons perigosos"
    icon: "mdi:ear-hearing"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    lambda: return id(sound_stream).is_enabled();
    turn_on_action:
      - lambda: id(sound_stream).set_enabled(true);
      - component.update: lcd
    turn_off_action:
      - lambda: id(sound_stream).set_enabled(false);
      - component.update: lcd

binary_sensor:
  - platform: template
    name: "Monitor de sons transmitindo"
    icon: "mdi:waveform"
    entity_category: diagnostic
    lambda: return id(sound_stream).is_streaming();
  - platform: gpio
    id: key_a
    name: "Botão A"
    pin: { number: GPIO11, inverted: true, mode: { input: true } }
    on_click:
      - switch.toggle: sound_monitor_switch
  - platform: gpio
    id: key_b
    name: "Botão B"
    pin: { number: GPIO12, inverted: true, mode: { input: true } }
    on_click:
      - component.update: lcd

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
  - platform: homeassistant
    id: ultimo_alerta
    entity_id: sensor.ultimo_perigo_detectado
    on_value:
      - component.update: lcd

button:
  - platform: restart
    id: restart_device
    name: "Reiniciar"
    icon: "mdi:restart"
    entity_category: config

sensor:
  # 0 dB = fundo de escala (dBFS). Passivo: só mede enquanto o monitor captura.
  - platform: sound_level
    passive: true
    measurement_duration: 1s
    microphone:
      microphone: mic
    rms:
      id: mic_rms
      name: "Nível do microfone"
      icon: "mdi:microphone"
      accuracy_decimals: 1
      entity_category: diagnostic
      state_class: measurement

globals:
  - id: mic_silent_since
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: mic_heal_attempted
    type: bool
    restore_value: false
    initial_value: "false"
  - id: mic_heal_busy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: es8311_ok
    type: bool
    restore_value: false
    initial_value: "true"

script:
  # Sequência do M5Unified (_microphone_enabled_cb_sticks3) + ADC scale 30 dB (mic_gain).
  # 0x16 = 5 é o valor do enum ES8311 30DB. Não chama no setup: o codec ainda não tem clock.
  - id: apply_es8311_adc
    mode: single
    parameters:
      restart_on_fail: bool
    then:
      - lambda: |-
          const uint8_t seq[][2] = {
            {0x00, 0x80}, {0x01, 0xBA}, {0x02, 0x18}, {0x0D, 0x01}, {0x0E, 0x02},
            {0x14, 0x10}, {0x16, 0x05}, {0x17, 0xBF}, {0x1C, 0x6A},
          };
          bool ok = true;
          for (auto &r : seq) {
            if (!id(es_raw).write_byte(r[0], r[1])) ok = false;
          }
          id(es8311_ok) = ok;
          if (ok) {
            ESP_LOGI("sticks3", "ES8311 ADC configurado (M5Unified, ganho 30 dB)");
          } else {
            ESP_LOGE("sticks3", "Falha de I2C ao escrever o ES8311");
          }
      - if:
          condition:
            lambda: return restart_on_fail && !id(es8311_ok);
          then:
            - logger.log:
                level: ERROR
                format: "Reinicialização do ES8311 falhou; reiniciando o StickS3"
            - button.press: restart_device

# Mantém o microfone capturando quando o monitor está ligado (não chamar no setup: crash).
# Se o nível fica abaixo de mic_silence_dbfs por vários minutos enquanto transmite,
# regrava o ES8311 e reabre o microfone; se isso não recuperar, reinicia.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - lambda: return !id(mic_heal_busy);
              - switch.is_on: sound_monitor_switch
              - not: { microphone.is_capturing: mic }
          then:
            - microphone.capture: mic
            - delay: 500ms
            - script.execute:
                id: apply_es8311_adc
                restart_on_fail: false
      - if:
          condition:
            and:
              - lambda: return !id(mic_heal_busy);
              - switch.is_off: sound_monitor_switch
              - microphone.is_capturing: mic
          then: [ microphone.stop_capture: mic ]
      - if:
          condition:
            lambda: |-
              if (id(mic_heal_busy) || !id(sound_stream).is_streaming()) return false;
              float level = id(mic_rms).state;
              return (level == level) && level < ${mic_silence_dbfs}f;
          then:
            - lambda: |-
                if (id(mic_silent_since) == 0) {
                  id(mic_silent_since) = millis();
                  ESP_LOGW("sticks3", "Microfone em %d dBFS (limiar -90); cronômetro de silêncio iniciado",
                           (int) id(mic_rms).state);
                }
            - if:
                condition:
                  lambda: return id(mic_silent_since) != 0 && (millis() - id(mic_silent_since) >= ${mic_silence_ms});
                then:
                  - if:
                      condition:
                        lambda: return id(mic_heal_attempted);
                      then:
                        - logger.log:
                            level: ERROR
                            format: "Microfone segue abaixo de -90 dBFS depois da reinicialização; reiniciando o StickS3"
                        - button.press: restart_device
                      else:
                        - lambda: |-
                            id(mic_heal_attempted) = true;
                            id(mic_silent_since) = 0;
                            id(mic_heal_busy) = true;
                            ESP_LOGW("sticks3", "Microfone em %d dBFS por vários minutos; reinicializando ES8311",
                                     (int) id(mic_rms).state);
                        - microphone.stop_capture: mic
                        - delay: 300ms
                        - microphone.capture: mic
                        - delay: 500ms
                        - script.execute:
                            id: apply_es8311_adc
                            restart_on_fail: true
                        - if:
                            condition:
                              not: { microphone.is_capturing: mic }
                            then:
                              - logger.log:
                                  level: ERROR
                                  format: "Microfone não voltou a capturar; reiniciando o StickS3"
                              - button.press: restart_device
                        - lambda: id(mic_heal_busy) = false;
          else:
            - lambda: |-
                float level = id(mic_rms).state;
                bool known = (level == level);
                if (id(sound_stream).is_streaming() && known && level >= ${mic_silence_dbfs}f) {
                  if (id(mic_silent_since) != 0 || id(mic_heal_attempted)) {
                    ESP_LOGI("sticks3", "Microfone recuperado (%d dBFS)", (int) level);
                  }
                  id(mic_silent_since) = 0;
                  id(mic_heal_attempted) = false;
                } else if (!id(sound_stream).is_streaming() && !id(mic_heal_attempted)) {
                  id(mic_silent_since) = 0;
                }
