# Parâmetros do detector. Rótulos são nomes exatos de classes do AudioSet/YAMNet
# (model/yamnet_class_map.csv). Pontuações do YAMNet são sigmoides independentes por classe (0..1).
#
# threshold         pontuação mínima numa janela para contar como "acerto"
# window / min_hits votação: dispara se houver min_hits acertos nas últimas `window` janelas
# cooldown_seconds  intervalo mínimo entre dois eventos da mesma categoria

hop_seconds = 0.5      # uma inferência a cada 0,5 s (janelas de 0,975 s com sobreposição)
clip_seconds = 4.0     # duração do WAV salvo em CLIPS_DIR para cada evento
min_rms_dbfs = -65.0   # janelas mais silenciosas que isso não passam pelo modelo

# Só aceita UDP destes IPs. Lista vazia = qualquer origem. Sirva para ignorar
# pacotes espúrios (por exemplo o roteador) que reaproveitam um buffer velho.
allowed_sources = []

# Fração mínima da janela do YAMNet (0,975 s) recebida nos últimos 1,5 s.
# Abaixo disso o buffer é considerado velho e não vai ao modelo.
min_fresh_fraction = 0.9

# Se > 0 e o log não está em DEBUG, registra as 5 classes principais quando
# alguma categoria chega a esta fração do limiar. 0 desliga.
near_miss_fraction = 0.0

[categories.grito]
labels = ["Screaming", "Yell"]
threshold = 0.35
window = 3
min_hits = 2
cooldown_seconds = 30

[categories.latido]
labels = ["Bark", "Bow-wow", "Yip"]
threshold = 0.40
window = 4
min_hits = 2
cooldown_seconds = 120

[categories.campainha]
labels = ["Doorbell", "Ding-dong"]
threshold = 0.30
window = 2
min_hits = 1
cooldown_seconds = 20
# Veto opcional (periquitos e outros pássaros). A janela deixa de contar quando
# veto >= veto_min e veto >= score * veto_ratio, a menos que um rótulo forte
# (toque real) passe de strong_threshold. Exemplo:
# veto_labels = ["Bird", "Bird vocalization, bird call, bird song", "Chirp, tweet", "Squawk"]
# veto_min = 0.15
# veto_ratio = 1.0
# strong_labels = ["Ding-dong"]
# strong_threshold = 0.45

[categories.alarme_incendio]
labels = ["Smoke detector, smoke alarm", "Fire alarm"]
threshold = 0.30
window = 4
min_hits = 2
cooldown_seconds = 60

# Explosões são transientes curtos: uma única janela já basta.
[categories.explosao]
labels = ["Explosion", "Boom", "Gunshot, gunfire"]
threshold = 0.40
window = 1
min_hits = 1
cooldown_seconds = 30
