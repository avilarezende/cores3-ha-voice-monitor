configuration:
  log_level:
    name: Nível de log
    description: DEBUG registra as 3 classes mais prováveis do YAMNet em cada janela analisada (útil para ajustar limiares).
  max_clips:
    name: Máximo de clipes
    description: Quantidade de clipes WAV de eventos mantidos em /media/sound-monitor; os mais antigos são apagados.
  live_device_mac:
    name: MAC do dispositivo ao vivo
    description: MAC do StickS3 (por exemplo 70:04:1d:dc:4b:40). Com o Mosquitto, cria o sensor Ouvintes ao vivo nesse dispositivo e põe o link Visitar no painel StickS3 ao vivo. Vazio não cria o vínculo.
network:
  5050/udp: Áudio PCM do CoreS3 (16 kHz, 16 bit, mono)
